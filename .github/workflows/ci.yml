name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q modules dashboard eda tests scripts main.py

      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: Dashboard smoke test (no exceptions)
        run: >
          python -c "
          from streamlit.testing.v1 import AppTest;
          at = AppTest.from_file('dashboard/app.py', default_timeout=180);
          at.run();
          assert not at.exception, at.exception;
          print('dashboard OK, exceptions:', len(at.exception))"
